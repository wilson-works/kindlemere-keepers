<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 58 184 188" role="img" aria-labelledby="t">
  <title id="t">Clem's mark: her head, with two leaf ears and the pear stem, cut from paper</title>
  <defs>
    <!-- Cut paper: a short, hard shadow straight below each layer. No blur. -->
    <filter id="layer" x="-10%" y="-10%" width="120%" height="130%">
      <feOffset in="SourceAlpha" dy="4" result="drop"/>
      <feFlood flood-color="#1A2433" flood-opacity="0.16"/>
      <feComposite in2="drop" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="layer-sm" x="-10%" y="-10%" width="120%" height="130%">
      <feOffset in="SourceAlpha" dy="2" result="drop"/>
      <feFlood flood-color="#1A2433" flood-opacity="0.18"/>
      <feComposite in2="drop" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <clipPath id="badge"><circle cx="180" cy="150" r="90"/></clipPath>
  <circle cx="180" cy="154" r="90" fill="#1A2433" fill-opacity="0.14"/>
  <circle cx="180" cy="150" r="90" fill="#FFE1C2"/>
  <g clip-path="url(#badge)">
  <!-- Ears: two long leaves, the right one tipped forward, listening. -->
  <g filter="url(#layer)">
    <path d="M164 140 C140 112 104 70 108 18 C138 34 172 84 174 136 Z" fill="#FFB36B"/>
    <path d="M168 134 C152 104 128 66 112 24" stroke="#E08A45" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g stroke="#E08A45" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M156 112 C148 110 142 104 140 98"/><path d="M146 94 C138 92 132 86 130 80"/><path d="M134 74 C128 72 124 66 122 60"/>
      <path d="M160 102 C164 96 166 90 165 84"/><path d="M150 84 C154 78 156 72 155 66"/><path d="M138 62 C142 56 143 50 142 44"/>
    </g>
  </g>
  <g filter="url(#layer)">
    <path d="M192 138 C200 92 232 50 272 40 C268 62 258 78 246 92 C234 108 216 124 198 142 Z" fill="#FFB36B"/>
    <path d="M196 136 C214 100 238 66 268 44" stroke="#E08A45" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g stroke="#E08A45" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M208 116 C214 116 220 114 224 110"/><path d="M222 96 C228 96 234 94 238 90"/><path d="M238 76 C244 76 250 74 254 70"/>
      <path d="M206 112 C204 104 204 98 206 92"/><path d="M220 92 C218 86 218 80 220 74"/><path d="M236 72 C234 66 235 60 238 56"/>
    </g>
  </g>

  <!-- The pear stem with its leaf. -->
  <g filter="url(#layer-sm)">
    <path d="M176 126 C174 112 178 100 186 92 L191 96 C185 104 182 114 184 126 Z" fill="#6B4A26"/>
    <path d="M188 100 C200 86 216 86 224 92 C214 102 200 106 188 100 Z" fill="#7A8A22"/>
    <path d="M190 99 C200 96 210 94 220 93" stroke="#525C12" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Body: a big round pear of orchard paper. -->
  <g filter="url(#layer)">
    <path d="M180 124 C150 124 140 154 146 182 C110 202 96 250 100 300 C104 352 140 382 180 382 C220 382 256 352 260 300 C264 250 250 202 214 182 C220 154 210 124 180 124 Z" fill="#525C12"/>
    <path d="M148 186 C118 206 108 250 112 296 C114 330 132 358 156 370 C128 352 118 320 120 286 C122 248 132 214 148 186 Z" fill="#FFFFFF" fill-opacity="0.08"/>
    <path d="M214 186 C236 202 250 236 250 280 C250 330 230 360 204 372 C236 356 254 324 254 288 C254 246 240 206 214 186 Z" fill="#1A2433" fill-opacity="0.12"/>
    <g fill="#6B7720">
      <circle cx="130" cy="252" r="2.4"/><circle cx="122" cy="276" r="1.8"/><circle cx="238" cy="256" r="2.2"/><circle cx="244" cy="290" r="1.8"/>
      <circle cx="164" cy="150" r="1.8"/><circle cx="198" cy="146" r="2"/><circle cx="232" cy="232" r="1.6"/><circle cx="118" cy="314" r="2"/>
    </g>
    <g fill="#3E4510">
      <circle cx="140" cy="232" r="1.6"/><circle cx="226" cy="318" r="2"/><circle cx="208" cy="160" r="1.4"/><circle cx="128" cy="300" r="1.4"/>
    </g>
  </g>

  <!-- Face. -->
  <ellipse cx="162" cy="192" rx="8" ry="10" fill="#1A2433"/>
  <ellipse cx="200" cy="192" rx="8" ry="10" fill="#1A2433"/>
  <circle cx="165" cy="188" r="3" fill="#FFFFFF"/><circle cx="160" cy="196" r="1.3" fill="#FFFFFF"/>
  <circle cx="203" cy="188" r="3" fill="#FFFFFF"/><circle cx="198" cy="196" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="148" cy="212" rx="11" ry="6.5" fill="#F2A78E" fill-opacity="0.9"/>
  <ellipse cx="214" cy="212" rx="11" ry="6.5" fill="#F2A78E" fill-opacity="0.9"/>
  <path d="M173 214 Q181 222 189 214" stroke="#1A2433" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- A dusting of flour on one ear's base, from the kitchen. -->
  <g fill="#FFFFFF" fill-opacity="0.75"><circle cx="168" cy="136" r="1.6"/><circle cx="172" cy="141" r="1.1"/><circle cx="163" cy="142" r="1.2"/></g>

  </g>
</svg>
