<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 70 184 188" role="img" aria-labelledby="t">
  <title id="t">Avo's mark: her avocado head, with two leaf ears and the stem, cut from paper</title>
  <defs>
    <!-- Cut paper: a short, hard shadow straight below each layer. No blur. -->
    <filter id="layer" x="-10%" y="-10%" width="120%" height="130%">
      <feOffset in="SourceAlpha" dy="4" result="drop"/>
      <feFlood flood-color="#1A2433" flood-opacity="0.16"/>
      <feComposite in2="drop" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="layer-sm" x="-10%" y="-10%" width="120%" height="130%">
      <feOffset in="SourceAlpha" dy="2" result="drop"/>
      <feFlood flood-color="#1A2433" flood-opacity="0.18"/>
      <feComposite in2="drop" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <clipPath id="badge"><circle cx="180" cy="162" r="90"/></clipPath>
  <circle cx="180" cy="166" r="90" fill="#1A2433" fill-opacity="0.14"/>
  <circle cx="180" cy="162" r="90" fill="#FFE1C2"/>
  <g clip-path="url(#badge)">
  <!-- Ears: two long avocado leaves, the right one tipped forward, listening. -->
  <g filter="url(#layer)">
    <path d="M164 140 C140 112 104 70 108 18 C138 34 172 84 174 136 Z" fill="#6E7D1C"/>
    <path d="M168 134 C152 104 128 66 112 24" stroke="#525C12" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g stroke="#525C12" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M156 112 C148 110 142 104 140 98"/><path d="M146 94 C138 92 132 86 130 80"/><path d="M134 74 C128 72 124 66 122 60"/>
      <path d="M160 102 C164 96 166 90 165 84"/><path d="M150 84 C154 78 156 72 155 66"/><path d="M138 62 C142 56 143 50 142 44"/>
    </g>
  </g>
  <g filter="url(#layer)">
    <path d="M192 138 C200 92 232 50 272 40 C268 62 258 78 246 92 C234 108 216 124 198 142 Z" fill="#6E7D1C"/>
    <path d="M196 136 C214 100 238 66 268 44" stroke="#525C12" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g stroke="#525C12" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M208 116 C214 116 220 114 224 110"/><path d="M222 96 C228 96 234 94 238 90"/><path d="M238 76 C244 76 250 74 254 70"/>
      <path d="M206 112 C204 104 204 98 206 92"/><path d="M220 92 C218 86 218 80 220 74"/><path d="M236 72 C234 66 235 60 238 56"/>
    </g>
  </g>

  <!-- The avocado stem with its one leaf. -->
  <g filter="url(#layer-sm)">
    <path d="M176 126 C174 112 178 100 186 92 L191 96 C185 104 182 114 184 126 Z" fill="#6B4A26"/>
    <path d="M188 100 C200 86 216 86 224 92 C214 102 200 106 188 100 Z" fill="#7A8A22"/>
    <path d="M190 99 C200 96 210 94 220 93" stroke="#525C12" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Body: a whole avocado. Dark skin round the back, pale flesh down the front, the pit for a belly. -->
  <g filter="url(#layer)">
    <path d="M180 124 C150 124 140 154 146 182 C110 202 96 250 100 300 C104 352 140 382 180 382 C220 382 256 352 260 300 C264 250 250 202 214 182 C220 154 210 124 180 124 Z" fill="#3E4A14"/>
    <path d="M146 182 C110 202 96 250 100 300 C104 352 140 382 180 382 C150 370 124 340 122 296 C120 250 130 208 152 186 C150 160 160 132 180 124 C160 128 142 152 146 182 Z" fill="#525C12"/>
    <g fill="#2E3610"><circle cx="118" cy="262" r="1.8"/><circle cx="112" cy="300" r="1.6"/><circle cx="246" cy="262" r="1.8"/><circle cx="250" cy="300" r="1.6"/><circle cx="230" cy="352" r="1.6"/><circle cx="134" cy="350" r="1.6"/></g>
    <g fill="#6B7720"><circle cx="124" cy="236" r="1.6"/><circle cx="118" cy="330" r="1.4"/><circle cx="240" cy="232" r="1.4"/></g>
  </g>
  <g filter="url(#layer-sm)">
    <path d="M180 140 C158 140 152 162 156 186 C126 204 116 248 120 296 C124 340 150 366 180 366 C210 366 236 340 240 296 C244 248 234 204 204 186 C208 162 202 140 180 140 Z" fill="#E8EDB0"/>
    <path d="M180 146 C162 146 157 165 161 188 C132 206 123 250 126 296 C129 336 154 360 180 360 C206 360 231 336 234 296 C237 250 228 206 199 188 C203 165 198 146 180 146 Z" fill="#D7E08A"/>
    <path d="M199 188 C228 206 237 250 234 296 C231 336 206 360 180 360 C204 348 222 326 224 294 C226 252 216 214 199 188 Z" fill="#C5CF72"/>
  </g>
  <g filter="url(#layer)">
    <circle cx="180" cy="300" r="40" fill="#8A5530"/>
    <path d="M146 318 C156 342 204 342 214 318 C210 336 196 340 180 340 C164 340 150 336 146 318 Z" fill="#6E4424"/>
    <ellipse cx="165" cy="284" rx="10" ry="6" fill="#FFFFFF" fill-opacity="0.3" transform="rotate(-30 165 284)"/>
    <circle cx="159" cy="296" r="2.4" fill="#FFFFFF" fill-opacity="0.25"/>
  </g>
  <!-- Face, on the flesh above the pit. -->
  <ellipse cx="164" cy="206" rx="7.5" ry="9.5" fill="#1A2433"/>
  <ellipse cx="196" cy="206" rx="7.5" ry="9.5" fill="#1A2433"/>
  <circle cx="167" cy="202" r="2.8" fill="#FFFFFF"/><circle cx="162" cy="210" r="1.2" fill="#FFFFFF"/>
  <circle cx="199" cy="202" r="2.8" fill="#FFFFFF"/><circle cx="194" cy="210" r="1.2" fill="#FFFFFF"/>
  <ellipse cx="151" cy="226" rx="9" ry="5.5" fill="#F2A78E" fill-opacity="0.9"/>
  <ellipse cx="209" cy="226" rx="9" ry="5.5" fill="#F2A78E" fill-opacity="0.9"/>
  <path d="M172 228 Q180 235 188 228" stroke="#1A2433" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  </g>
</svg>
