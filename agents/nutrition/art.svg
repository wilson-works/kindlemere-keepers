<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 0 384 440" role="img" aria-labelledby="t d">
  <title id="t">Clem, keeper of the Orchard Isle</title>
  <desc id="d">A round cut-paper creature shaped like a pear, in orchard olive, with two long leaf ears. She wears a white apron with seed packets in its pockets, holds a steaming apricot kettle in one paw and a wooden spoon in the other, and stands on a tuft of orchard grass with herbs and a fallen apricot.</desc>
