<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 0 384 440" role="img" aria-labelledby="t d">
  <title id="t">Avo, keeper of the Orchard</title>
  <desc id="d">An avocado, cut from paper: dark olive skin, pale flesh down her front and the round brown pit for a belly, with two long avocado-leaf ears and a stem with one leaf. She carries a satchel of seed-packet cards, holds a steaming apricot kettle and a wooden spoon, and stands with her feet planted on the Orchard's grass over a bank of soil and roots, beside half an avocado.</desc>
  <defs>
    <!-- Cut paper: a short, hard shadow straight below each layer. No blur. -->
    <filter id="layer" x="-10%" y="-10%" width="120%" height="130%">
      <feOffset in="SourceAlpha" dy="4" result="drop"/>
      <feFlood flood-color="#1A2433" flood-opacity="0.16"/>
      <feComposite in2="drop" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="layer-sm" x="-10%" y="-10%" width="120%" height="130%">
      <feOffset in="SourceAlpha" dy="2" result="drop"/>
      <feFlood flood-color="#1A2433" flood-opacity="0.18"/>
      <feComposite in2="drop" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The ground: orchard grass running off both edges, over a cut bank of soil and roots. Rooted, never floating. -->
