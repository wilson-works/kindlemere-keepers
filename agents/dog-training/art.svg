    <ellipse id="arm-l" cx="36" cy="156" rx="12" ry="20" transform="rotate(24 36 156)"/>
    <ellipse id="arm-r" cx="164" cy="156" rx="12" ry="20" transform="rotate(-24 164 156)"/>
    <ellipse id="foot-l" cx="74" cy="214" rx="18" ry="9"/>
    <ellipse id="foot-r" cx="126" cy="214" rx="18" ry="9"/>
    <rect id="whistle" x="88" y="140" width="24" height="13" rx="6.5"/>
  </defs>
  <g fill="rgba(26,36,51,0.14)">
