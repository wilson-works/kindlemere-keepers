  <path d="M188 104 C204 112 208 124 206 134" fill="none" stroke="#CFE6EA" stroke-width="3.5" stroke-dasharray="3 4"/>
  <g filter="url(#tumble-layer)" transform="rotate(78 206 146)">
    <rect x="188" y="139" width="38" height="14" rx="7" fill="#FFFFFF"/>
    <rect x="182" y="142" width="9" height="8" rx="3" fill="#F3F8DF"/>
    <rect x="200" y="139" width="6" height="14" fill="#1F5C6E"/>
    <rect x="211" y="143" width="3" height="6" rx="1.5" fill="#1A2433"/>
    <rect x="217" y="143" width="3" height="6" rx="1.5" fill="#1A2433"/>
    <circle cx="225" cy="142" r="3" fill="none" stroke="#1F5C6E" stroke-width="2"/>
  </g>

  <!-- The treat pouch, clipped to Tumble's side -->
  <g filter="url(#tumble-layer)">
    <circle cx="90" cy="206" r="4" fill="none" stroke="#CFE6EA" stroke-width="2.5"/>
    <path d="M74 212 h32 v20 q0 10 -10 10 h-12 q-10 0 -10 -10 Z" fill="#E5B07A"/>
    <path d="M72 210 h36 v8 q-18 8 -36 0 Z" fill="#6E3A12"/>
    <circle cx="90" cy="218" r="2.5" fill="#CFE6EA"/>
  </g>
  <path d="M80 230 q6 3 12 0" fill="none" stroke="#B06A2F" stroke-width="2" stroke-linecap="round"/>

  <!-- The other stub arm, holding out a biscuit -->
  <g filter="url(#tumble-layer)">
    <ellipse cx="86" cy="182" rx="10" ry="16" transform="rotate(48 86 182)" fill="#A8622E"/>
    <ellipse cx="72" cy="192" rx="9" ry="8.5" fill="#6E3A12"/>
    <path d="M58 186 q6 -8 14 -4 q4 2 4 6 q-2 6 -10 6 q-8 0 -8 -8 Z" fill="#E5B07A"/>
  </g>
  <circle cx="64" cy="188" r="1.2" fill="#B06A2F"/>
  <circle cx="69" cy="186" r="1.2" fill="#B06A2F"/>

  <!-- The dog: lean and long-legged, mostly white, a ginger head with a white blaze, sitting nicely with a head tilt -->
