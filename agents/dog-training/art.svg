  <path d="M160 96 C206 120 214 238 160 264" fill="none" stroke="#6E3A12" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M78 196 C120 218 200 218 242 196" fill="none" stroke="#6E3A12" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M86 140 C110 150 128 152 140 150" fill="none" stroke="#6E3A12" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
