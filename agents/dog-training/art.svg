  <g filter="url(#tumble-layer)">
    <path d="M284 258 C300 256 312 240 306 224 C302 214 290 214 292 222 C296 232 294 246 280 250 Z" fill="#FFFFFF"/>
    <ellipse cx="284" cy="255" rx="6" ry="5" fill="#C97C3D"/>
