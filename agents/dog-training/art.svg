    <path d="M248 214 Q264 220 282 213 L268 236 Z" fill="#4E7A3A"/>
  </g>
  <circle cx="258" cy="219" r="2" fill="#C2D77A"/>
  <path d="M266 222 q4 -3 5 1 q-1 4 -5 2 Z" fill="#C2D77A"/>
  <circle cx="273" cy="218" r="1.6" fill="#DDEBA6"/>
  <circle cx="267" cy="229" r="1.4" fill="#DDEBA6"/>
  <g filter="url(#tumble-layer)">
    <rect x="262" y="238" width="9" height="4" rx="2" fill="#CFE6EA"/>
    <circle cx="262" cy="238" r="2.2" fill="#CFE6EA"/><circle cx="262" cy="242" r="2.2" fill="#CFE6EA"/>
    <circle cx="271" cy="238" r="2.2" fill="#CFE6EA"/><circle cx="271" cy="242" r="2.2" fill="#CFE6EA"/>
  </g>
  <!-- the head, tilted: ginger, a white blaze to a white muzzle, one ear perked with its tip folded over, one flopped -->
  <g transform="rotate(-16 266 194)">
    <g filter="url(#tumble-layer)">
      <path d="M252 182 C248 170 248 160 252 154 C258 160 260 170 260 180 Z" fill="#C97C3D"/>
      <path d="M252 154 C246 152 242 156 242 162 C246 160 250 160 253 162 Z" fill="#8A4F22"/>
      <path d="M276 180 C284 182 290 190 290 200 C286 202 282 198 278 192 Z" fill="#C97C3D"/>
      <path d="M290 200 C288 204 284 204 282 200 C284 198 287 197 290 200 Z" fill="#8A4F22"/>
      <ellipse cx="266" cy="190" rx="17" ry="15" fill="#C97C3D"/>
      <path d="M264 176 C268 176 269 184 268 192 C274 196 274 206 266 208 C256 208 254 198 262 192 C261 184 261 176 264 176 Z" fill="#FFFFFF"/>
      <ellipse cx="264" cy="202" rx="10" ry="7" fill="#FFFFFF"/>
    </g>
    <ellipse cx="264" cy="199" rx="3.6" ry="2.8" fill="#1A2433"/>
    <circle cx="263" cy="198" r="0.9" fill="#FFFFFF"/>
    <path d="M260 205 q4 3 8 0" fill="none" stroke="#1A2433" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="257" cy="189" r="3.2" fill="#6B4226"/>
    <circle cx="275" cy="189" r="3.2" fill="#6B4226"/>
    <circle cx="257" cy="189" r="1.6" fill="#1A2433"/>
    <circle cx="275" cy="189" r="1.6" fill="#1A2433"/>
    <circle cx="256" cy="188" r="0.9" fill="#FFFFFF"/>
    <circle cx="274" cy="188" r="0.9" fill="#FFFFFF"/>
  </g>
  <!-- the tail's wag -->
  <path d="M310 214 q6 -3 9 0" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
