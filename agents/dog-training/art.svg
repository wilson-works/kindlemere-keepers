    <rect x="246" y="228" width="34" height="6" rx="3" fill="#1F5C6E"/>
    <circle cx="262" cy="238" r="4" fill="#FFFFFF"/>
  </g>
  <ellipse cx="252" cy="218" rx="4" ry="3" fill="#1A2433"/>
  <circle cx="256" cy="206" r="3.4" fill="#1A2433"/>
  <circle cx="271" cy="205" r="3.4" fill="#FFFFFF"/>
  <circle cx="271" cy="205" r="2.4" fill="#1A2433"/>
  <circle cx="255" cy="205" r="1.1" fill="#FFFFFF"/>
  <circle cx="270" cy="204" r="0.9" fill="#FFFFFF"/>
  <path d="M296 214 q6 -4 10 -2" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  <path d="M298 222 q6 -2 10 1" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  <!-- the ball -->
  <g filter="url(#tumble-layer)">
    <circle cx="58" cy="262" r="8" fill="#C2D77A"/>
  </g>
  <path d="M52 257 q6 5 12 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
