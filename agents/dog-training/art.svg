<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="tumble-t tumble-d">
  <title id="tumble-t">Tumble, the dog trainer of Whistle Meadow</title>
  <desc id="tumble-d">Tumble, a round haystack-shaped keeper made of russet cut paper with straw strands, stands in a patch of meadow grass. One grass-plume ear is perked and one tips forward to listen. Tumble waves with one stub arm and holds out a small biscuit with the other, a willow whistle on a braided cord at the chest. Beside Tumble a small black-and-white dog in a teal collar sits looking up, tail mid-wag, a ball at its paws. A willow hoop stands on the left and a scent-trail flag on the right.</desc>
  <defs>
    <!-- Cut paper: each layer sits on a short, hard shadow 3 px straight below it. No blur. -->
    <filter id="tumble-layer" x="-10%" y="-10%" width="120%" height="130%">
      <feFlood flood-color="#1A2433" flood-opacity="0.16" result="ink"/>
      <feComposite in="ink" in2="SourceAlpha" operator="in" result="sil"/>
      <feOffset in="sil" dy="3" result="drop"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tumble-lift" x="-10%" y="-10%" width="120%" height="130%">
      <feFlood flood-color="#1A2433" flood-opacity="0.24" result="ink"/>
      <feComposite in="ink" in2="SourceAlpha" operator="in" result="sil"/>
      <feOffset in="sil" dy="5" result="drop"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The meadow patch -->
  <g filter="url(#tumble-layer)">
    <ellipse cx="160" cy="276" rx="150" ry="18" fill="#C2D77A"/>
    <ellipse cx="160" cy="272" rx="128" ry="12" fill="#DDEBA6"/>
  </g>
  <g fill="#9DB54E">
    <path d="M22 276 l6 -22 l5 22 Z"/><path d="M34 278 l4 -15 l5 15 Z"/><path d="M64 280 l5 -18 l4 18 Z"/>
    <path d="M250 280 l5 -20 l5 20 Z"/><path d="M290 276 l4 -16 l4 16 Z"/><path d="M302 274 l3 -12 l4 12 Z"/>
    <path d="M112 284 l4 -13 l4 13 Z"/><path d="M206 285 l4 -14 l4 14 Z"/>
  </g>
  <g fill="#7E9A3A">
    <path d="M27 278 l3 -14 l4 14 Z"/><path d="M70 281 l3 -11 l3 11 Z"/><path d="M296 277 l3 -10 l3 10 Z"/>
    <path d="M118 285 l3 -9 l3 9 Z"/><path d="M212 286 l3 -9 l3 9 Z"/>
  </g>
  <!-- Clover in the grass -->
  <g fill="#FFFFFF">
    <circle cx="48" cy="268" r="3"/><circle cx="52" cy="266" r="3"/><circle cx="50" cy="270" r="3"/>
    <circle cx="276" cy="270" r="3"/><circle cx="280" cy="268" r="3"/><circle cx="278" cy="272" r="3"/>
  </g>
  <circle cx="50" cy="268" r="1.6" fill="#E5B07A"/>
  <circle cx="278" cy="270" r="1.6" fill="#E5B07A"/>

  <!-- A willow hoop, bound with bark strips -->
  <g filter="url(#tumble-layer)">
    <path d="M26 270 C26 190 96 190 96 270" fill="none" stroke="#B9C46A" stroke-width="9" stroke-linecap="round"/>
    <path d="M26 270 C26 190 96 190 96 270" fill="none" stroke="#7E9A3A" stroke-width="9" stroke-dasharray="3 11"/>
  </g>
  <path d="M40 214 q-6 -10 -2 -18 q4 8 2 18 Z" fill="#9DB54E"/>
  <path d="M84 216 q8 -8 6 -17 q-7 7 -6 17 Z" fill="#9DB54E"/>

  <!-- A scent-trail flag -->
  <g filter="url(#tumble-layer)">
    <rect x="296" y="196" width="4" height="78" rx="2" fill="#6E3A12"/>
    <path d="M300 198 L318 207 L300 216 Z" fill="#E5B07A"/>
    <path d="M300 207 L318 207 L300 216 Z" fill="#CFE6EA"/>
  </g>

