<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 54 320 246" role="img" aria-labelledby="tumble-t tumble-d">
  <title id="tumble-t">Tumble, the dog trainer of Whistle Meadow</title>
  <desc id="tumble-d">Tumble, a large russet herding ball of cut paper with a moulded handle loop on top, seams, a lighter highlight panel, a few tooth marks and grass stains, sits on the meadow grass. Tumble has bright eyes, warm cheeks and a smile, waves with one stub arm and holds out a small biscuit with the other. A willow whistle hangs from the handle on a braided cord, and a treat pouch is clipped to Tumble's side. Beside Tumble a lean, long-legged, mostly white dog with a ginger head and a white blaze sits nicely with a head tilt, one ear perked with its tip folded and one flopped, a green paisley bandana and a bone-shaped tag, its curled tail mid-wag and a tennis ball at its paws. A willow hoop stands on the left and a scent-trail flag on the right.</desc>
  <defs>
    <!-- Cut paper: each layer sits on a short, hard shadow 3 px straight below it. No blur. -->
    <filter id="tumble-layer" x="-30%" y="-40%" width="160%" height="180%">
      <feFlood flood-color="#1A2433" flood-opacity="0.16" result="ink"/>
      <feComposite in="ink" in2="SourceAlpha" operator="in" result="sil"/>
      <feOffset in="sil" dy="3" result="drop"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tumble-lift" x="-30%" y="-40%" width="160%" height="180%">
      <feFlood flood-color="#1A2433" flood-opacity="0.24" result="ink"/>
      <feComposite in="ink" in2="SourceAlpha" operator="in" result="sil"/>
      <feOffset in="sil" dy="5" result="drop"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The meadow floor: ground that runs off both edges, never a floating patch -->
