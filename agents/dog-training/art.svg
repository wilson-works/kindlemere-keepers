  <circle cx="178" cy="163" r="3.2" fill="#FFFFFF"/>
  <circle cx="142" cy="169" r="1.3" fill="#FFFFFF"/>
  <circle cx="184" cy="169" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="124" cy="185" rx="10" ry="6.5" fill="#E5B07A"/>
  <ellipse cx="196" cy="185" rx="10" ry="6.5" fill="#E5B07A"/>
  <path d="M150 186 Q160 196 170 186" fill="none" stroke="#1A2433" stroke-width="3.2" stroke-linecap="round"/>

  <!-- The willow whistle hangs from the handle on its braided cord -->
