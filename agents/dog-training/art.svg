<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-labelledby="t d">
  <title id="t">Tumble, the dog trainer of Whistle Meadow</title>
  <desc id="d">A round russet cut-paper creature shaped like a soft haystack, with two long lime grass-plume ears, two dot eyes, short arms, tiny feet and a white willow whistle on a cord.</desc>
