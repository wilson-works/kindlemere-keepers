  <!-- the tennis ball, by the dog's paws -->
  <g filter="url(#tumble-layer)">
    <circle cx="236" cy="266" r="7" fill="#D6E26A"/>
  </g>
  <path d="M230 262 q6 5 12 0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
</svg>
