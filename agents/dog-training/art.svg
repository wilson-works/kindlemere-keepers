  <g filter="url(#tumble-layer)">
    <!-- left ear, perked straight up -->
    <path d="M140 116 C126 84 114 46 120 14 C132 40 150 80 154 112 Z" fill="#9DB54E"/>
    <path d="M144 114 C134 86 126 54 132 26 C142 52 156 84 158 112 Z" fill="#C2D77A"/>
