  <g filter="url(#tumble-layer)">
    <path d="M246 270 C242 240 248 214 264 206 C282 210 292 236 292 270 Z" fill="#FFFFFF"/>
    <ellipse cx="282" cy="256" rx="14" ry="15" fill="#FFFFFF"/>
    <path d="M290 266 C292 270 300 271 302 268 C302 264 296 262 290 264 Z" fill="#FFFFFF"/>
  </g>
  <ellipse cx="285" cy="254" rx="7" ry="8" fill="#C97C3D"/>
  <path d="M281 232 c-6 -5 -9 -10 -4 -13 c3 -2 5 0 4 2 c-1 -2 1 -4 4 -2 c5 3 2 8 -4 13 Z" fill="#C97C3D"/>
  <!-- long front legs and paws -->
