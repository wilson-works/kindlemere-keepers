  <path d="M0 280 Q80 274 160 279 T320 278 V300 H0 Z" fill="#9DB54E"/>
  <path d="M0 292 Q90 288 170 292 T320 291 V300 H0 Z" fill="#6E3A12"/>
  <!-- contact shadows where Tumble and the dog stand -->
  <ellipse cx="160" cy="266" rx="70" ry="7" fill="rgba(26,36,51,0.18)"/>
  <ellipse cx="262" cy="270" rx="34" ry="5" fill="rgba(26,36,51,0.18)"/>
  <g fill="#9DB54E">
    <path d="M22 276 l6 -22 l5 22 Z"/><path d="M34 278 l4 -15 l5 15 Z"/><path d="M64 280 l5 -18 l4 18 Z"/>
    <path d="M250 280 l5 -20 l5 20 Z"/><path d="M290 276 l4 -16 l4 16 Z"/><path d="M302 274 l3 -12 l4 12 Z"/>
    <path d="M112 284 l4 -13 l4 13 Z"/><path d="M206 285 l4 -14 l4 14 Z"/>
  </g>
  <g fill="#7E9A3A">
    <path d="M27 278 l3 -14 l4 14 Z"/><path d="M70 281 l3 -11 l3 11 Z"/><path d="M296 277 l3 -10 l3 10 Z"/>
    <path d="M118 285 l3 -9 l3 9 Z"/><path d="M212 286 l3 -9 l3 9 Z"/>
  </g>
  <!-- Clover in the grass -->
  <g fill="#FFFFFF">
    <circle cx="48" cy="268" r="3"/><circle cx="52" cy="266" r="3"/><circle cx="50" cy="270" r="3"/>
    <circle cx="276" cy="270" r="3"/><circle cx="280" cy="268" r="3"/><circle cx="278" cy="272" r="3"/>
  </g>
  <circle cx="50" cy="268" r="1.6" fill="#E5B07A"/>
  <circle cx="278" cy="270" r="1.6" fill="#E5B07A"/>

  <!-- A willow hoop, bound with bark strips -->
  <g filter="url(#tumble-layer)">
    <path d="M26 270 C26 190 96 190 96 270" fill="none" stroke="#B9C46A" stroke-width="9" stroke-linecap="round"/>
    <path d="M26 270 C26 190 96 190 96 270" fill="none" stroke="#7E9A3A" stroke-width="9" stroke-dasharray="3 11"/>
  </g>
  <path d="M40 214 q-6 -10 -2 -18 q4 8 2 18 Z" fill="#9DB54E"/>
  <path d="M84 216 q8 -8 6 -17 q-7 7 -6 17 Z" fill="#9DB54E"/>

  <!-- A scent-trail flag -->
  <g filter="url(#tumble-layer)">
    <rect x="296" y="196" width="4" height="78" rx="2" fill="#6E3A12"/>
    <path d="M300 198 L318 207 L300 216 Z" fill="#E5B07A"/>
    <path d="M300 207 L318 207 L300 216 Z" fill="#CFE6EA"/>
  </g>

