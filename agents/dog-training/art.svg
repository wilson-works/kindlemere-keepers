    <path d="M182 112 C194 84 214 64 244 58 C228 76 206 94 194 116 Z" fill="#C2D77A"/>
    <path d="M186 112 C196 92 210 78 232 72 C220 86 204 100 196 116 Z" fill="#DDEBA6"/>
