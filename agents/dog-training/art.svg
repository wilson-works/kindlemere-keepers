  <path d="M176 147 q9 -6 18 1" fill="none" stroke="#6E3A12" stroke-width="4" stroke-linecap="round"/>
  <circle cx="145" cy="162" r="8.5" fill="#1A2433"/>
  <circle cx="185" cy="162" r="8.5" fill="#1A2433"/>
  <circle cx="142" cy="159" r="3" fill="#FFFFFF"/>
  <circle cx="182" cy="159" r="3" fill="#FFFFFF"/>
  <circle cx="148" cy="165" r="1.3" fill="#FFFFFF"/>
  <circle cx="188" cy="165" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="131" cy="180" rx="9" ry="6" fill="#E5B07A"/>
  <ellipse cx="199" cy="180" rx="9" ry="6" fill="#E5B07A"/>
  <path d="M157 180 Q165 188 173 180" fill="none" stroke="#1A2433" stroke-width="3" stroke-linecap="round"/>

  <!-- The willow whistle on its braided cord -->
  <path d="M138 176 Q150 206 160 210" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M192 176 Q180 206 170 210" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M138 176 Q150 206 160 210" fill="none" stroke="#CFE6EA" stroke-width="3.5" stroke-dasharray="3 4"/>
  <path d="M192 176 Q180 206 170 210" fill="none" stroke="#CFE6EA" stroke-width="3.5" stroke-dasharray="3 4"/>
  <g filter="url(#tumble-layer)" transform="rotate(-8 165 214)">
    <rect x="146" y="206" width="40" height="15" rx="7.5" fill="#FFFFFF"/>
    <rect x="140" y="209" width="10" height="9" rx="3" fill="#F3F8DF"/>
    <rect x="160" y="206" width="6" height="15" fill="#1F5C6E"/>
    <rect x="171" y="210" width="3" height="7" rx="1.5" fill="#1A2433"/>
    <rect x="177" y="210" width="3" height="7" rx="1.5" fill="#1A2433"/>
    <circle cx="185" cy="209" r="3" fill="none" stroke="#1F5C6E" stroke-width="2"/>
  </g>

  <!-- The other arm, holding out a biscuit -->
  <g filter="url(#tumble-layer)">
    <ellipse cx="104" cy="214" rx="13" ry="22" transform="rotate(38 104 214)" fill="#8E4E1E"/>
    <ellipse cx="90" cy="232" rx="11" ry="10" fill="#6E3A12"/>
    <path d="M78 226 q6 -8 14 -4 q4 2 4 6 q-2 6 -10 6 q-8 0 -8 -8 Z" fill="#E5B07A"/>
  </g>
  <circle cx="84" cy="228" r="1.2" fill="#B06A2F"/>
  <circle cx="89" cy="226" r="1.2" fill="#B06A2F"/>

  <!-- Tumble's feet -->
  <g filter="url(#tumble-layer)">
    <ellipse cx="138" cy="264" rx="20" ry="9" fill="#6E3A12"/>
    <ellipse cx="192" cy="264" rx="20" ry="9" fill="#6E3A12"/>
  </g>

  <!-- The dog: a small black-and-white herding dog, sitting, looking up -->
  <g filter="url(#tumble-layer)">
    <path d="M276 252 C292 246 300 232 294 220 C306 232 302 252 284 258 Z" fill="#2B3445"/>
    <ellipse cx="262" cy="246" rx="24" ry="22" fill="#2B3445"/>
