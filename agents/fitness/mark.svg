  <ellipse cx="35.6" cy="18.6" rx="1.6" ry="1.9" fill="#1A2433"/>
  <circle cx="29" cy="17.8" r="0.6" fill="#FFFFFF"/><circle cx="36.2" cy="17.8" r="0.6" fill="#FFFFFF"/>
  <ellipse cx="33.5" cy="11" rx="3.4" ry="2.2" fill="#D8C7A6"/>
