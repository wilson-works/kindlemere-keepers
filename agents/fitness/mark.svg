<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">Steady's mark: three stacked granite paper stones with a pebble sash and a small white star</title>
  <!-- Cut paper (kit/REALM.md): flat shapes, each on a short hard shadow below it. Same stones as art.svg. -->
  <g fill="rgba(26,36,51,0.16)">
    <ellipse cx="32" cy="50" rx="22" ry="11"/>
    <ellipse cx="32" cy="34.5" rx="15.5" ry="8.5"/>
    <ellipse cx="32" cy="21.5" rx="10.5" ry="7.5"/>
  </g>
  <!-- base -->
  <ellipse cx="32" cy="47" rx="22" ry="11" fill="#4B5D6E"/>
  <path d="M11 49 Q32 62 53 48 Q50 57 32 58 Q14 57 11 49 Z" fill="#3A4856"/>
  <path d="M17 43 L23 38 L31 37 L24 41 L21 45 Z" fill="#5E7284"/>
  <g stroke="#C9D3DB" stroke-width="1.4" stroke-linecap="round"><path d="M38 41.5 l-0.6 5"/><path d="M41 41.5 l-0.6 5"/><path d="M44 41.5 l-0.6 5"/><path d="M36.5 45 l9 -2.6"/></g>
  <!-- middle and its sash -->
