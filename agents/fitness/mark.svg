    <circle cx="31.5" cy="38.4" r="2.1" fill="#D8C7A6"/>
    <circle cx="37" cy="37.4" r="2.1" fill="#FFFFFF"/>
    <circle cx="42.5" cy="34.6" r="2" fill="#7E9B6A"/>
  </g>
  <path d="M44 23.5 l1.2 2.6 2.6 1.2 -2.6 1.2 -1.2 2.6 -1.2 -2.6 -2.6 -1.2 2.6 -1.2z" fill="#FFFFFF"/>
  <!-- top, with eyes and cheeks -->
  <ellipse cx="32" cy="19" rx="10.5" ry="7.5" fill="#7E909F"/>
  <path d="M23 21 Q32 28 41 20.5 Q39 26 32 26.5 Q25 26 23 21 Z" fill="#687A89"/>
