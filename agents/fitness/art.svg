    <path d="M86 284 q6 -6 12 -2 q6 -6 12 0 q-2 8 -12 8 q-10 2 -12 -6 z" fill="#6FAF78"/>
    <circle cx="94" cy="282" r="1.6" fill="#A7D3A0"/><circle cx="104" cy="280" r="1.4" fill="#A7D3A0"/>
  </g>

    <!-- the lifted foot, stretched out to balance -->
  <g transform="rotate(-22 252 286)">
    <ellipse cx="252" cy="286" rx="22" ry="10" fill="#1A2433"/>
    <path d="M264 290 v-5 M254 292 v-6 M244 291 v-5" stroke="#4A5568" stroke-width="2.4" stroke-linecap="round"/>
