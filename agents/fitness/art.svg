    <g fill="#D9578C"><circle cx="110" cy="276" r="2.4"/><circle cx="132" cy="288" r="1.8"/><circle cx="226" cy="252" r="2.2"/><circle cx="96" cy="250" r="1.6"/><circle cx="150" cy="232" r="1.6"/></g>
    <g fill="#7A1240"><circle cx="122" cy="262" r="1.8"/><circle cx="238" cy="262" r="1.6"/><circle cx="172" cy="292" r="2"/></g>
