    <ellipse cx="166" cy="76" rx="12" ry="8" fill="#C8CDD8"/>
    <ellipse cx="162" cy="73" rx="4" ry="2" fill="#FFFFFF" opacity="0.9"/>
  </g>
<!-- The star in the seam -->
  <g>
    <path d="M204 142 l4.5 9.5 9.5 4.5 -9.5 4.5 -4.5 9.5 -4.5 -9.5 -9.5 -4.5 9.5 -4.5z" fill="#FFFFFF"/>
    <circle cx="220" cy="138" r="2" fill="#FFFFFF"/><circle cx="192" cy="166" r="1.5" fill="#FFFFFF"/>
  </g>

  </svg>
