  <!-- balance marks -->
  <g stroke="#8FA2FF" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M266 232 q10 10 0 22"/><path d="M276 226 q14 16 0 34"/>
    <path d="M54 232 q-10 10 0 22"/>
  </g>

  <!-- Middle stone -->
