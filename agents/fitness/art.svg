    <g>
      <ellipse cx="106" cy="184" rx="8" ry="6.5" fill="#FFFFFF"/>
      <ellipse cx="124" cy="196" rx="9" ry="7" fill="#C8CDD8"/>
      <ellipse cx="143" cy="203" rx="8" ry="7.5" fill="#E58AB0"/>
      <ellipse cx="162" cy="205" rx="9.5" ry="7" fill="#FFFFFF"/>
      <ellipse cx="181" cy="202" rx="8" ry="7" fill="#B7C3FF"/>
      <ellipse cx="199" cy="195" rx="8.5" ry="6.5" fill="#C8CDD8"/>
      <ellipse cx="216" cy="184" rx="7.5" ry="6" fill="#FFFFFF"/>
      <g fill="#FFFFFF" opacity="0.85">
        <ellipse cx="121" cy="193" rx="3" ry="1.5"/><ellipse cx="140" cy="200" rx="3" ry="1.5"/><ellipse cx="178" cy="199" rx="3" ry="1.5"/><ellipse cx="196" cy="192" rx="3" ry="1.5"/>
      </g>
      <g fill="#A9B1C2"><circle cx="160" cy="207" r="1.2"/><circle cx="104" cy="186" r="1"/><circle cx="218" cy="186" r="1"/></g>
    </g>
    <!-- a mountain flower tucked into the sash -->
    <g>
      <path d="M228 178 q16 -16 22 -36" stroke="#4E8A5A" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M240 160 q12 -2 14 8 q-10 0 -14 -8 z" fill="#6FAF78"/>
      <g fill="#F4B6CF"><circle cx="252" cy="126" r="6.5"/><circle cx="263" cy="133" r="6.5"/><circle cx="260" cy="145" r="6.5"/><circle cx="247" cy="146" r="6.5"/><circle cx="243" cy="134" r="6.5"/></g>
