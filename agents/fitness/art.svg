<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 58 304 310" width="304" height="310" role="img" aria-labelledby="t d">
  <title id="t">Steady, keeper of the Stepping Peaks</title>
  <desc id="d">An invented creature of cut paper standing with both feet planted on a wide stone step: three stacked
    round stones, rose, periwinkle and rose, flat paper with speckles and facets. The top stone tilts a little, with bright
    eyes, round cheeks and a small pebble balanced on it. Across the middle stone runs a stitched sash of mismatched
    pebbles with a mountain flower tucked in it. Five scratched tally marks on the base count the steps climbed. A tiny
    white star sits in the seam. Beside the step: the edge of the summit pool, peak grass and a trail flag. No sky or
    scene behind: that is the realm's own.</desc>
  <!-- Cut paper (kit/REALM.md): flat pieces, no outlines or gradients; depth from layering and short hard shadows. -->

  <!-- The stone step -->
  <g>
    <path d="M24 322 Q24 306 44 304 L276 300 Q298 300 298 318 L298 344 Q298 358 280 358 L42 360 Q24 360 24 346 Z" fill="rgba(26,36,51,0.16)" transform="translate(0 4)"/>
