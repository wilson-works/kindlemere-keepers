<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 58 304 310" width="304" height="310" role="img" aria-labelledby="t d">
  <title id="t">Cairn, keeper of the Stepping Peaks</title>
  <desc id="d">An invented creature of cut paper standing on a wide stone step: three stacked round stones, rose,
    periwinkle and rose, speckled and layered. The top stone tilts a little, with bright eyes, round cheeks and a
    small pebble balanced on it. Across the middle stone runs a stitched sash of mismatched pebbles with a mountain
    flower tucked in it. Five scratched tally marks on the base count the steps climbed. A tiny white star glints
    in the seam. A tuft of peak grass grows at the foot of the step. No sky or scene behind: that is the realm's own.</desc>
  <!-- Cut paper (kit/REALM.md): flat pieces, no outlines or gradients; depth from layering and short hard shadows. -->

  <!-- The stone step -->
  <g>
    <path d="M24 322 Q24 306 44 304 L276 300 Q298 300 298 318 L298 344 Q298 358 280 358 L42 360 Q24 360 24 346 Z" fill="rgba(26,36,51,0.16)" transform="translate(0 4)"/>
    <path d="M24 322 Q24 306 44 304 L276 300 Q298 300 298 318 L298 344 Q298 358 280 358 L42 360 Q24 360 24 346 Z" fill="#C3CCF0"/>
    <path d="M24 322 Q24 306 44 304 L276 300 Q298 300 298 318 L298 326 Q160 334 24 330 Z" fill="#DCE2FA"/>
    <path d="M60 340 l14 -2 M118 346 l22 -1 M214 342 l18 1 M252 350 l12 -2" stroke="#A9B4E2" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 330 q8 -2 10 6" stroke="#A9B4E2" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="150" y="352" font-family="Candara, Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#8E9AD0">7</text>
    <circle cx="88" cy="350" r="2.2" fill="#A9B4E2"/><circle cx="182" cy="352" r="1.8" fill="#A9B4E2"/><circle cx="240" cy="338" r="2" fill="#A9B4E2"/>
  </g>
  <!-- A tuft of peak grass and two loose pebbles -->
  <g>
    <path d="M262 304 q-6 -22 2 -34 q2 16 6 30 q4 -20 16 -28 q-6 18 -6 32 q8 -12 18 -14 q-10 10 -12 16 z" fill="#4E8A5A"/>
    <path d="M268 302 q0 -14 6 -22 q-2 12 0 22 z" fill="#6FAF78"/>
    <rect x="283" y="236" width="4" height="66" rx="2" fill="#8A6A4E"/>
    <path d="M287 240 L312 248 L287 258 Z" fill="rgba(26,36,51,0.16)" transform="translate(0 3)"/>
    <path d="M287 240 L312 248 L287 258 Z" fill="#8FA2FF"/>
    <circle cx="295" cy="249" r="2.4" fill="#FFFFFF"/>
    <!-- the edge of the summit pool -->
    <path d="M26 300 Q26 286 52 284 L96 284 Q112 286 110 298 Q104 312 70 312 Q30 312 26 300 Z" fill="#A9B4E2"/>
    <path d="M32 298 Q34 290 54 289 L94 289 Q104 291 102 298 Q96 306 70 306 Q38 306 32 298 Z" fill="#3E8094"/>
    <path d="M44 296 q8 -3 16 0 M70 299 q8 -3 16 0" stroke="#CFE6EA" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="88" cy="294" rx="5" ry="2" fill="#CFE6EA" opacity="0.8"/>
    <ellipse cx="112" cy="318" rx="6" ry="4" fill="#E58AB0"/>
  </g>

  <!-- Shadow under Cairn -->
  <ellipse cx="160" cy="318" rx="92" ry="12" fill="rgba(26,36,51,0.16)"/>

  <!-- Feet: one planted, one lifted. Cairn is practising balance at the pool. -->
  <g>
    <ellipse cx="126" cy="312" rx="24" ry="11" fill="#1A2433"/>
    <path d="M114 316 v-5 M124 318 v-6 M134 317 v-5" stroke="#4A5568" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="120" cy="307" rx="8" ry="3" fill="#4A5568"/>
  </g>

  <!-- Base stone -->
  <g>
    <ellipse cx="160" cy="258" rx="96" ry="54" fill="rgba(26,36,51,0.16)" transform="translate(0 5)"/>
    <ellipse cx="160" cy="258" rx="96" ry="54" fill="#B0205C"/>
    <path d="M70 270 Q160 318 252 266 Q246 300 160 312 Q76 302 70 270 Z" fill="#8E1748"/>
    <path d="M92 226 Q118 206 160 204 Q132 214 116 232 Q100 244 92 226 Z" fill="#C9497F"/>
    <path d="M78 252 Q112 262 150 256" stroke="#8E1748" stroke-width="3" fill="none" stroke-linecap="round"/>
