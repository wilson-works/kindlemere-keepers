    <ellipse cx="177" cy="110" rx="6.5" ry="8" fill="#1A2433"/>
    <circle cx="145.5" cy="106.5" r="2.6" fill="#FFFFFF"/><circle cx="179.5" cy="106.5" r="2.6" fill="#FFFFFF"/>
    <circle cx="141" cy="113" r="1.1" fill="#FFFFFF"/><circle cx="175" cy="113" r="1.1" fill="#FFFFFF"/>
    <!-- a small smile, because a balanced day is a good day -->
