<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 320 320" width="320" height="320" role="img" aria-labelledby="t d">
<title id="t">Steady, keeper of Stepping Hill (worried)</title>
<desc id="d">An invented creature of cut paper on the grass of Stepping Hill: three stacked round stones, granite slate, river stone and grey, with paper grain and speckles; big eyes with highlights, brows, cheeks and a mouth; a sash of white, sand and moss pebbles with a buttercup; a small white paper star. Here: leaning back, brows tipped up, a wobbly mouth, a bead of sweat. Beside: a granite outcrop with moss and a trail flag, the edge of a small pool, park flowers, and a cut bank of soil and roots.</desc>
