<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindlemere</title>
<link rel="stylesheet" href="/kit/design/tokens.css">
<link rel="stylesheet" href="/kit/kit.css">
<style>
  .scene { display: block; width: 100%; height: auto; border-radius: var(--km-radius-lg); box-shadow: var(--km-layer); background: #DCE5EC; }
  figure { margin: 0 0 var(--km-space-5); }
  figcaption { margin-top: var(--km-space-2); color: var(--km-ink-soft); font-size: var(--km-text-sm); }
</style>
</head>
<body>
<header class="km-top">
  <div><div class="km-name">Kindlemere</div><div class="km-role">One park beside one lake, under the real sky</div></div>
</header>
<main class="km-page">
  <figure>
    <img class="scene" src="/kit/art/kindlemere.svg" width="3200" height="1800" alt="Kindlemere: the Orchard, Stepping Hill and Lakeside Field beside a teal lake, joined by paths at a signpost, under a sky that follows the time of day.">
    <figcaption>The whole realm. The sun and the moon rise and set at the real hours for this computer's place, and the land is lit to match. After dark, stars and fireflies come out and the dog sleeps in its house.</figcaption>
  </figure>
  <div class="km-grid">
    <figure data-agent="nutrition">
      <img class="scene" src="/kit/art/kindlemere-orchard.svg" width="1600" height="900" alt="The Orchard: the avocado keeper by the long table under the string lights.">
      <figcaption>The Orchard, a foresty picnic meadow.</figcaption>
    </figure>
    <figure data-agent="fitness">
      <img class="scene" src="/kit/art/kindlemere-hill.svg" width="1600" height="900" alt="Stepping Hill: the stacked-stone keeper at the foot of the stone steps.">
      <figcaption>Stepping Hill.</figcaption>
    </figure>
    <figure data-agent="dog-training">
      <img class="scene" src="/kit/art/kindlemere-field.svg" width="1600" height="900" alt="Lakeside Field: the herding ball by the dog house, and a white and ginger dog in the shallows.">
      <figcaption>Lakeside Field and the lake.</figcaption>
    </figure>
  </div>
  <p>When a keeper doesn't know something, they send a lantern across the lake to Louise, our librarian, and learn from the book she sends back.</p>
</main>
<footer class="km-foot"><p>The mere: the lake under every page.</p></footer>
<script src="/kit/kit.js"></script>
</body>
</html>
