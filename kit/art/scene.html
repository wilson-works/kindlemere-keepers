<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindlemere</title>
<link rel="stylesheet" href="/kit/design/tokens.css">
<link rel="stylesheet" href="/kit/kit.css">
<style>
  .scene { display: block; width: 100%; height: auto; border-radius: var(--km-radius-lg); box-shadow: var(--km-layer); background: #DCE5EC; }
  figure { margin: 0 0 var(--km-space-5); }
  figcaption { margin-top: var(--km-space-2); color: var(--km-ink-soft); font-size: var(--km-text-sm); }
</style>
</head>
<body>
<header class="km-top">
  <div><div class="km-name">Kindlemere</div><div class="km-role">Three places beside one lake</div></div>
</header>
<main class="km-page">
  <figure>
    <img class="scene" src="/kit/art/kindlemere.svg" alt="Kindlemere: the Orchard, Stepping Hill and Lakeside Field beside a teal lake, joined by paths at a signpost. Paper lanterns drift across the water toward Louise.">
    <figcaption>The whole realm.</figcaption>
  </figure>
  <div class="km-grid">
    <figure data-agent="nutrition">
      <img class="scene" src="/kit/art/kindlemere-orchard.svg" alt="The Orchard: the avocado keeper at the picnic table, holding up a card.">
      <figcaption>The Orchard, a foresty picnic meadow. Mid-morning.</figcaption>
    </figure>
    <figure data-agent="fitness">
      <img class="scene" src="/kit/art/kindlemere-hill.svg" alt="Stepping Hill: the stacked-stone keeper at the foot of the stone steps.">
      <figcaption>Stepping Hill. High noon.</figcaption>
    </figure>
    <figure data-agent="dog-training">
      <img class="scene" src="/kit/art/kindlemere-field.svg" alt="Lakeside Field: the herding ball waves on a white and ginger dog galloping through the shallows.">
      <figcaption>Lakeside Field and the lake. Late afternoon.</figcaption>
    </figure>
  </div>
  <p>When a keeper doesn't know something, they send a lantern across the lake to Louise, our librarian, and learn from the book she sends back.</p>
</main>
<footer class="km-foot"><p>The mere: the lake under every page.</p></footer>
</body>
</html>
